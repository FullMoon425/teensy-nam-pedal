; 08_ui_integration: 조작계(03) + OLED(04) 통합 테스트
; 저장소 루트에서:  pio run -d sketches/08_ui_integration -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

board_build.f_cpu = 600000000L

build_flags =
  -O2
  -DUSB_SERIAL

lib_deps =
  olikraus/U8g2
