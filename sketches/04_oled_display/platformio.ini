; 04_oled_display: OLED 표시 확인 (U8g2)
; 저장소 루트에서:  pio run -d sketches/04_oled_display -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

board_build.f_cpu = 600000000L

build_flags =
  -O2
  -DUSB_SERIAL

lib_deps =
  olikraus/U8g2
