; 09_breadboard_system: 입력 버퍼 + 오디오실드 + 간단 DSP + 조작계 + OLED 전체 브레드보드 테스트 (NAM 없음)
; 48kHz는 build_flags로 코어·Audio 라이브러리까지 같이 적용해야 합니다 (06과 같은 방식, software-design.md 3장).
; 저장소 루트에서:  pio run -d sketches/09_breadboard_system -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

board_build.f_cpu = 600000000L

build_flags =
  -O2
  -DUSB_SERIAL
  -DAUDIO_SAMPLE_RATE_EXACT=48000.0f

lib_deps =
  olikraus/U8g2
