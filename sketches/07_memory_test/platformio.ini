; 07_memory_test: RAM1(DTCM) / RAM2(OCRAM) / PSRAM 읽기·쓰기 검증과 속도 측정
; 저장소 루트에서:  pio run -d sketches/07_memory_test -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

board_build.f_cpu = 600000000L

build_flags =
  -O2
  -DUSB_SERIAL
