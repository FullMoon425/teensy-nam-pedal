; 06_nam_benchmark (S0): 48kHz 설정 검증 + 아키텍처별 CPU 벤치마크
; 01~05와 달리 PlatformIO로 빌드합니다. 스케치 안의 #define은 Audio 라이브러리에 적용되지 않기 때문입니다.
; 저장소 루트에서:  pio run -d sketches/06_nam_benchmark -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 115200

; CPU 클럭 (벤치마크에서 600000000L / 816000000L 두 가지로 측정)
board_build.f_cpu = 600000000L

; build_flags는 코어·Audio 라이브러리에도 적용됩니다. build_src_flags는 src/에만 적용되어
; 라이브러리와 샘플레이트 값이 어긋나므로 쓰지 않습니다 (docs/software-design.md 3장).
build_flags =
  -O2
  -DUSB_SERIAL
  -DAUDIO_SAMPLE_RATE_EXACT=48000.0f
