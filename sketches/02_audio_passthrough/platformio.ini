; 02_audio_passthrough: 오디오실드 LINE IN → LINE OUT 패스스루 (44.1kHz 기본값)
; 저장소 루트에서:  pio run -d sketches/02_audio_passthrough -t upload

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

board_build.f_cpu = 600000000L

build_flags =
  -O2
  -DUSB_SERIAL
