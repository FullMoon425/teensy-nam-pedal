; 메인 NAM 펌웨어 (PlatformIO)
; VS Code에서 이 firmware/ 폴더를 열고 빌드/업로드하세요.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 115200

; CPU 클럭 (기본 600MHz, 벤치마크 후 필요하면 816000000)
board_build.f_cpu = 600000000L

build_flags =
  -O2
  -DUSB_SERIAL
  ; 48kHz: S0(06_nam_benchmark)에서 검증한 뒤 주석을 풉니다 (software-design.md 3장).
  ; build_flags는 코어·라이브러리에도 적용되므로 Audio 라이브러리를 고칠 필요가 없습니다.
  ; -DAUDIO_SAMPLE_RATE_EXACT=48000.0f

lib_deps =
  olikraus/U8g2
  bblanchon/ArduinoJson@^7
